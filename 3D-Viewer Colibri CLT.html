<div id="viewer" style="width: 100%; height: 600px; position: relative; background: white;">
  <canvas id="renderCanvas" style="width: 100%; height: 100%; display: block;"></canvas>
  <svg id="lineOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></svg>
  <div id="labelsContainer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;"></div>
  <div id="infoBox" style="position: absolute; top: 20px; right: 20px; width: 250px; background: white; color: black; border: 1px solid orange; padding: 12px; font-family: 'Bahnschrift', sans-serif; font-size: 14px; box-shadow: 0 0 6px orange; display: none; z-index: 3;"></div>

  <button id="toggleLabelsBtn" style="position: absolute; bottom: 70px; right: 20px; z-index: 5; padding: 10px 16px; font-family: 'Bahnschrift', sans-serif; font-size: 14px; background: white; border: 1px solid orange; border-radius: 6px; box-shadow: 0 0 4px rgba(0,0,0,0.2); cursor: pointer;">Labels anzeigen</button>
  <button id="toggleOptions" style="position: absolute; bottom: 20px; right: 20px; z-index: 5; padding: 10px 16px; font-family: 'Bahnschrift', sans-serif; font-size: 14px; background: white; border: 1px solid orange; border-radius: 6px; box-shadow: 0 0 4px rgba(0,0,0,0.2); cursor: pointer;">Optionen anzeigen</button>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.min.js"></script>
<script src="https://cdn.babylonjs.com/environment.js"></script>

<script>
const canvas = document.getElementById("renderCanvas");
const viewer = document.getElementById("viewer");
const labelsContainer = document.getElementById("labelsContainer");
const lineOverlay = document.getElementById("lineOverlay");
const engine = new BABYLON.Engine(canvas, true);
const infoBox = document.getElementById("infoBox");
const toggleLabelsBtn = document.getElementById("toggleLabelsBtn");
const toggleOptions = document.getElementById("toggleOptions");

let scene, camera, defaultLabels = [], altLabels = [], currentLabelSet, rotationTimeout, isAutoRotating = false;

const defaultLabelData = [
  { text: "01 – Frässpindel", basePosition: new BABYLON.Vector3(150, 40, 20), targetPosition: new BABYLON.Vector3(30, 20, 0) },
  { text: "02 – Lagerblock", basePosition: new BABYLON.Vector3(-160, 30, 20), targetPosition: new BABYLON.Vector3(-40, 25, 20) },
  { text: "03 – Kühlung", basePosition: new BABYLON.Vector3(120, 20, -80), targetPosition: new BABYLON.Vector3(20, 10, -50) },
];

const altLabelData = [
  { text: "A – Gehäuse", basePosition: new BABYLON.Vector3(180, 60, -60), targetPosition: new BABYLON.Vector3(60, 30, -40) },
  { text: "B – Adapter", basePosition: new BABYLON.Vector3(-180, 50, 60), targetPosition: new BABYLON.Vector3(-60, 30, 40) }
];

function createLabel(label) {
  const div = document.createElement("div");
  div.textContent = label.text;
  div.style.cssText = "position:absolute;padding:4px 8px;background:white;color:black;border:1px solid orange;border-radius:6px;font-family:'Bahnschrift';font-size:13px;white-space:nowrap;box-shadow:1px 1px 4px rgba(0,0,0,0.3);cursor:pointer;pointer-events:auto";
  div.addEventListener("click", () => {
    infoBox.innerText = `Detailinformationen zu: ${label.text}`;
    infoBox.style.display = "block";
  });
  labelsContainer.appendChild(div);
  label.element = div;

  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("stroke", "orange");
  line.setAttribute("stroke-width", "2");
  lineOverlay.appendChild(line);
  label.line = line;
}

function updateLabelPositions(set) {
  const width = viewer.clientWidth;
  const scale = 1 + width / 3000;
  const positions = [];

  set.forEach(label => {
    const pos = label.basePosition.scale(scale);
    const labelProj = BABYLON.Vector3.Project(pos, BABYLON.Matrix.Identity(), scene.getTransformMatrix(), camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight()));
    const targetProj = BABYLON.Vector3.Project(label.targetPosition, BABYLON.Matrix.Identity(), scene.getTransformMatrix(), camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight()));

    let x = labelProj.x;
    let y = labelProj.y;
    const spacing = 30;
    positions.forEach(p => {
      if (Math.abs(p.y - y) < spacing) y = p.y + spacing;
    });
    positions.push({ x, y });

    label.element.style.left = `${x}px`;
    label.element.style.top = `${y}px`;

    const rect = label.element.getBoundingClientRect();
    const midX = x + rect.width / 2;
    const midY = y + rect.height / 2;

    label.line.setAttribute("x1", midX);
    label.line.setAttribute("y1", midY);
    label.line.setAttribute("x2", targetProj.x);
    label.line.setAttribute("y2", targetProj.y);
  });
}

function setLabels(setData) {
  labelsContainer.innerHTML = "";
  lineOverlay.innerHTML = "";
  const labels = setData.map(label => ({ ...label }));
  labels.forEach(createLabel);
  currentLabelSet = labels;
}

function createScene() {
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(1, 1, 1, 1);

  camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 4, Math.PI / 2.5, 400, BABYLON.Vector3.Zero(), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 500;
  camera.upperRadiusLimit = 500;

  const light = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-2, -3, -2), scene);
  light.position = new BABYLON.Vector3(200, 300, 200);
  light.intensity = 1.3;

  const shadowGenerator = new BABYLON.ShadowGenerator(2048, light);
  shadowGenerator.useBlurExponentialShadowMap = true;
  shadowGenerator.blurKernel = 64;
  shadowGenerator.shadowMaxZ = 1000;

  const envTex = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/studio.env", scene);
  scene.environmentTexture = envTex;
  scene.createDefaultEnvironment({ environmentTexture: envTex, createGround: false, createSkybox: false });

  BABYLON.SceneLoader.ImportMesh(null, "https://pd2470.github.io/Levicron-TestWebsite/", "Test.glb", scene, function (meshes) {
    const root = new BABYLON.TransformNode("root", scene);
    meshes.forEach(m => {
      m.parent = root;
      m.receiveShadows = false;
      m.castShadows = true;
      shadowGenerator.addShadowCaster(m);
      if (m.material && m.material instanceof BABYLON.PBRMaterial) {
        m.material.metallic = 1.0;
        m.material.roughness = 0.05;
        m.material.environmentIntensity = 1.5;
      }
    });
    const bounding = root.getHierarchyBoundingVectors(true);
    const center = bounding.min.add(bounding.max).scale(0.5);
    root.position = root.position.subtract(center);
    root.position.y = Math.abs(bounding.min.y);

    setLabels(defaultLabelData);

    scene.onBeforeRenderObservable.add(() => {
      updateLabelPositions(currentLabelSet);
      if (isAutoRotating) camera.alpha += 0.0015;
    });
  });

  return scene;
}

createScene();

engine.runRenderLoop(() => {
  if (scene) scene.render();
});

window.addEventListener("resize", () => engine.resize());

canvas.addEventListener("mousemove", () => {
  clearTimeout(rotationTimeout);
  isAutoRotating = false;
  rotationTimeout = setTimeout(() => isAutoRotating = true, 5000);
});

toggleLabelsBtn.addEventListener("click", () => {
  const isVisible = labelsContainer.style.display !== "none";
  labelsContainer.style.display = isVisible ? "none" : "block";
  lineOverlay.style.display = isVisible ? "none" : "block";
  toggleLabelsBtn.innerText = isVisible ? "Labels anzeigen" : "Labels ausblenden";
});

toggleOptions.addEventListener("click", () => {
  const showAlt = toggleOptions.innerText === "Optionen anzeigen";
  toggleOptions.innerText = showAlt ? "Optionen ausblenden" : "Optionen anzeigen";
  setLabels(showAlt ? altLabelData : defaultLabelData);

  const targetAlpha = showAlt ? Math.PI / 2 : Math.PI / 4;
  const targetBeta = showAlt ? Math.PI / 2 : Math.PI / 2.5;

  BABYLON.Animation.CreateAndStartAnimation("cameraMove", camera, "alpha", 60, 30, camera.alpha, targetAlpha, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
  BABYLON.Animation.CreateAndStartAnimation("cameraBeta", camera, "beta", 60, 30, camera.beta, targetBeta, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);

  isAutoRotating = !showAlt;
});
</script>
