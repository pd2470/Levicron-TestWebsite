<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Levicron 3D Viewer</title>
  <style>
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      background-color: white;
    }

    #labelsContainer, #lineOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: opacity 0.5s ease;
      pointer-events: none;
      z-index: 2;
    }

    #infoBox {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 250px;
      background: white;
      color: black;
      border: 1px solid orange;
      padding: 12px;
      font-family: 'Bahnschrift', sans-serif;
      font-size: 14px;
      box-shadow: 0 0 6px orange;
      display: none;
      z-index: 3;
    }

    #toggleOptions {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 5;
      padding: 10px 16px;
      font-family: 'Bahnschrift', sans-serif;
      font-size: 14px;
      background: white;
      border: 1px solid orange;
      border-radius: 6px;
      box-shadow: 0 0 4px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .staticLabel {
      background: white;
      color: black;
      border: 1px solid orange;
      border-radius: 6px;
      font-family: 'Bahnschrift';
      font-size: 14px;
      padding: 6px 12px;
      box-shadow: 1px 1px 4px rgba(0,0,0,0.3);
      cursor: default;
      max-width: 300px;
      text-align: center;
    }

    #staticLabels {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 40px;
      z-index: 4;
      pointer-events: auto;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body width="100%">
  <table width="100%">
    <tr width="100%">
      <th width="100%">
        <div id="viewer" style="width: 100%; height: 600px; position: relative; background: white;">
          <canvas id="renderCanvas"></canvas>
          <svg id="lineOverlay"></svg>
          <div id="labelsContainer"></div>
          <div id="infoBox"></div>
          <button id="toggleOptions">Optionen anzeigen</button>

          <!-- Neue statische Labels -->
          <div id="staticLabels">
            <div class="staticLabel" id="staticLabel1">Hohe Drehzahlen bis 90.000 Upm für die Mikrobearbeitung</div>
            <div class="staticLabel" id="staticLabel2">Geringste Spindelfehler ihrer Klasse nach DIN ISO230-7 zur Bearbeitung von optischen Komponenten</div>
          </div>
        </div>
      </th>
    </tr>
  </table>
  

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.min.js"></script>
  <script src="https://cdn.babylonjs.com/environment.js"></script>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const viewer = document.getElementById("viewer");
    const labelsContainer = document.getElementById("labelsContainer");
    const lineOverlay = document.getElementById("lineOverlay");
    const engine = new BABYLON.Engine(canvas, true);
    const infoBox = document.getElementById("infoBox");
    const toggleOptions = document.getElementById("toggleOptions");

    let scene, camera, currentLabelSet, rotationTimeout, isAutoRotating = false, cameraLocked = false;

    const defaultLabelData = [
      { text: "Automatische, federloser HSK-E 25 Werkzeugschnittstelle\nnach DIN69893 (SLH25)", basePosition: new BABYLON.Vector3(-200, 70, 0), targetPosition: new BABYLON.Vector3(-240, 70, -10) },
      { text: "Auch mit hochdruck-aerostatischem Lagersystem (UASD-H25) verfügbar", basePosition: new BABYLON.Vector3(-100, 0, 20), targetPosition: new BABYLON.Vector3(-150, 70, -10) },
      { text: "Effiziente Dünnfilm-Flüssigkeitskühlung", basePosition: new BABYLON.Vector3(-50, 110, 60), targetPosition: new BABYLON.Vector3(-50, 110, -10) },
    ];

    const altLabelData = [
      { text: "Drehzahloptionen\n\u2022 60,000 upm\n\u2022 80,000 upm\n\u2022 90,000 upm", basePosition: new BABYLON.Vector3(0, 0, 0), targetPosition: new BABYLON.Vector3(0, 0, 0) },
      { text: "Lageroptionen\n\u2022 Standard\n\u2022 Hybrid\n\u2022 Hochdruck", basePosition: new BABYLON.Vector3(-100, -50, 0), targetPosition: new BABYLON.Vector3(-140, 70, 0) },
      { text: "HSK25 Spannsystem\n\u2022 UTS Werkzeughalter zusätzlich erhältlich", basePosition: new BABYLON.Vector3(-150, 0, 0), targetPosition: new BABYLON.Vector3(-240, 70, 0) },
      { text: "Spindelanschlussoptionen\n\u2022 Radiale Anschlüsse (wie hier zu sehen)\n\u2022 Axiale Anschlüsse (ASD-H25A)", basePosition: new BABYLON.Vector3(260, -20, 0), targetPosition: new BABYLON.Vector3(110, 70, 0) },
      { text: "Motoroptionen\n\u2022 200V Luftspalt (geringe Spindelfehler)\n\u2022 400V Luftspalt (geringe Spindelfehler)\n\u2022 200V geblecht (hohes Drehmoment)\n\u2022 400V geblecht (hohes Drehmoment)", basePosition: new BABYLON.Vector3(80, -40, 0), targetPosition: new BABYLON.Vector3(50, 70, 0) }
    ];

    function createLabel(label) {
      const div = document.createElement("div");
      div.innerHTML = label.text
        .replace(/^([^\n]+)\n/, '<u>$1</u><br>')
        .replace(/\n/g, '<br>')
        .replace(/•/g, '&bull;');
      div.style.cssText = "position:absolute;padding:4px 8px;background:white;color:black;border:1px solid orange;border-radius:6px;font-family:'Bahnschrift';font-size:14px;white-space:nowrap;box-shadow:1px 1px 4px rgba(0,0,0,0.3);cursor:pointer;pointer-events:auto;transition: opacity 0.5s ease;";
      labelsContainer.appendChild(div);
      label.element = div;

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("stroke", "orange");
      line.setAttribute("stroke-width", "2");
      lineOverlay.appendChild(line);
      label.line = line;
    }

    function updateLabelPositions(set) {
      const width = viewer.clientWidth;
      const scale = 1 + width / 3000;
      const positions = [];

      set.forEach(label => {
        const pos = label.basePosition.scale(scale);
        const labelProj = BABYLON.Vector3.Project(pos, BABYLON.Matrix.Identity(), scene.getTransformMatrix(), camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight()));
        const targetProj = BABYLON.Vector3.Project(label.targetPosition, BABYLON.Matrix.Identity(), scene.getTransformMatrix(), camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight()));

        let x = labelProj.x;
        let y = labelProj.y;
        const spacing = 30;
        positions.forEach(p => {
          if (Math.abs(p.y - y) < spacing) y = p.y + spacing;
        });
        positions.push({ x, y });

        label.element.style.left = `${x}px`;
        label.element.style.top = `${y}px`;

        const rect = label.element.getBoundingClientRect();
        const midX = x + rect.width / 2;
        const midY = y + rect.height / 2;

        label.line.setAttribute("x1", midX);
        label.line.setAttribute("y1", midY);
        label.line.setAttribute("x2", targetProj.x);
        label.line.setAttribute("y2", targetProj.y);
      });
    }

    function setLabels(setData) {
      labelsContainer.innerHTML = "";
      lineOverlay.innerHTML = "";
      const labels = setData.map(label => ({ ...label }));
      labels.forEach(createLabel);
      currentLabelSet = labels;
    }

    function showLabels(show) {
      labelsContainer.style.opacity = show ? "1" : "0";
      lineOverlay.style.opacity = show ? "1" : "0";
      document.getElementById("staticLabels").style.opacity = show ? "1" : "0";
    }

    function updateScene(){
      const width = viewer.clientWidth;

      console.log(width);

      zoom = width / 1900;

      document.getElementById("viewer").style.transform = "scale(" + zoom + ")";
    }

    function createScene() {
      scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(1, 1, 1, 1);

      camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 4, Math.PI / 2.5, 400, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 500;
      camera.upperRadiusLimit = 500;

      const light = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-2, -3, -2), scene);
      light.position = new BABYLON.Vector3(200, 300, 200);
      light.intensity = 1.3;

      const shadowGenerator = new BABYLON.ShadowGenerator(2048, light);
      shadowGenerator.useBlurExponentialShadowMap = true;
      shadowGenerator.blurKernel = 64;
      shadowGenerator.shadowMaxZ = 1000;

      const envTex = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/studio.env", scene);
      scene.environmentTexture = envTex;
      scene.createDefaultEnvironment({ environmentTexture: envTex, createGround: false, createSkybox: false });

      BABYLON.SceneLoader.ImportMesh(null, "https://pd2470.github.io/Levicron-TestWebsite/", "Test.glb", scene, function (meshes) {
        const root = new BABYLON.TransformNode("root", scene);
        meshes.forEach(m => {
          m.parent = root;
          m.receiveShadows = false;
          m.castShadows = true;
          shadowGenerator.addShadowCaster(m);
          if (m.material && m.material instanceof BABYLON.PBRMaterial) {
            m.material.metallic = 1.0;
            m.material.roughness = 0.05;
            m.material.environmentIntensity = 1.5;
          }
        });
        const bounding = root.getHierarchyBoundingVectors(true);
        const center = bounding.min.add(bounding.max).scale(0.5);
        root.position = root.position.subtract(center);
        root.position.y = Math.abs(bounding.min.y);

        setLabels(defaultLabelData);
        showLabels(true);

        scene.onBeforeRenderObservable.add(() => {
          updateLabelPositions(currentLabelSet);
          if (isAutoRotating && camera.inputs.attached.pointers && !cameraLocked) camera.alpha += 0.0015;
        });
      });

      return scene;
    }

    createScene();
    engine.runRenderLoop(() => {
      if (scene) scene.render();
    });

    window.addEventListener("resize", () => engine.resize());
    window.addEventListener("resize", () => updateScene());

    canvas.addEventListener("mousemove", () => {
      clearTimeout(rotationTimeout);
      isAutoRotating = false;
      if (!cameraLocked) showLabels(true);
      rotationTimeout = setTimeout(() => {
        if (!cameraLocked) {
          isAutoRotating = true;
          showLabels(false);
        } else {
          isAutoRotating = false;
          showLabels(true);
        }
      }, 5000);
    });

    toggleOptions.addEventListener("click", () => {
      const showAlt = toggleOptions.innerText === "Optionen anzeigen";
      toggleOptions.innerText = showAlt ? "Optionen ausblenden" : "Optionen anzeigen";
      setLabels(showAlt ? altLabelData : defaultLabelData);
      document.getElementById("staticLabel1").hidden = showAlt;
      document.getElementById("staticLabel2").hidden = showAlt;

      const targetAlpha = showAlt ? Math.PI / 2 : Math.PI / 4;
      const targetBeta = showAlt ? Math.PI / 2 : Math.PI / 2.5;

      BABYLON.Animation.CreateAndStartAnimation("cameraMove", camera, "alpha", 60, 30, camera.alpha, targetAlpha, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
      BABYLON.Animation.CreateAndStartAnimation("cameraBeta", camera, "beta", 60, 30, camera.beta, targetBeta, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);

      cameraLocked = showAlt;
      isAutoRotating = !showAlt;
      if (showAlt) {
        camera.detachControl();
      } else {
        camera.attachControl(canvas, true);
      }
    });
  </script>
</body>
</html>
